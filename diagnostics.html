<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020b1e">
  <meta name="color-scheme" content="dark">
  <title>HEX GFX Status</title>
  <style>
    :root {
      --bg: #020b1e;
      --panel: #051022;
      --card: #081931;
      --border: #194669;
      --text: #eef7ff;
      --muted: #97a6bb;
      --accent: #35bef2;
      --pass: #43d389;
      --warn: #ffbe48;
      --fail: #ff5e70;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 85% 8%, rgba(53, 190, 242, .13), transparent 30rem),
        radial-gradient(circle at 10% 85%, rgba(67, 211, 137, .07), transparent 28rem),
        var(--bg);
    }

    main {
      width: min(760px, calc(100% - 28px));
      margin: 0 auto;
      padding: max(28px, env(safe-area-inset-top)) 0
        max(34px, env(safe-area-inset-bottom));
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 22px;
    }

    .eyebrow {
      margin: 0 0 7px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 8vw, 44px);
      line-height: 1.04;
      letter-spacing: -.04em;
    }

    .intro {
      max-width: 560px;
      margin: 11px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    button {
      appearance: none;
      border: 1px solid var(--accent);
      border-radius: 11px;
      padding: 11px 15px;
      color: #01111f;
      background: var(--accent);
      font: inherit;
      font-size: 12px;
      font-weight: 850;
      letter-spacing: .04em;
      white-space: nowrap;
      cursor: pointer;
    }

    button:disabled { cursor: wait; opacity: .55; }
    button:focus-visible { outline: 3px solid rgba(53, 190, 242, .32); outline-offset: 3px; }

    .summary, .checks {
      border: 1px solid var(--border);
      border-radius: 17px;
      background: rgba(5, 16, 34, .9);
      box-shadow: 0 22px 70px rgba(0, 0, 0, .23);
      overflow: hidden;
    }

    .summary {
      display: flex;
      align-items: center;
      gap: 15px;
      min-height: 96px;
      padding: 18px;
      margin-bottom: 15px;
    }

    .summary-dot, .check-dot {
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 7px rgba(53, 190, 242, .10);
    }

    .summary-dot { width: 18px; height: 18px; }
    .summary-dot.loading { animation: pulse 1.1s ease-in-out infinite alternate; }
    .summary-dot.pass, .check-dot.pass { background: var(--pass); }
    .summary-dot.warn, .check-dot.warn { background: var(--warn); }
    .summary-dot.fail, .check-dot.fail { background: var(--fail); }

    @keyframes pulse {
      from { transform: scale(.75); opacity: .5; }
      to { transform: scale(1); opacity: 1; }
    }

    .summary h2 {
      margin: 0 0 4px;
      font-size: 17px;
      letter-spacing: -.01em;
    }

    .summary p, .check p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .check {
      display: grid;
      grid-template-columns: 12px 1fr auto;
      align-items: center;
      gap: 13px;
      min-height: 72px;
      padding: 14px 17px;
      border-bottom: 1px solid rgba(25, 70, 105, .62);
    }

    .check:last-child { border-bottom: 0; }
    .check-dot { width: 10px; height: 10px; box-shadow: none; }
    .check h3 { margin: 0 0 3px; font-size: 14px; }

    .badge {
      border: 1px solid currentColor;
      border-radius: 999px;
      padding: 5px 8px;
      color: var(--accent);
      font-size: 9px;
      font-weight: 900;
      letter-spacing: .08em;
    }

    .badge.pass { color: var(--pass); }
    .badge.warn { color: var(--warn); }
    .badge.fail { color: var(--fail); }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-top: 14px;
      padding: 0 3px;
      color: var(--muted);
      font-size: 10.5px;
      line-height: 1.45;
    }

    @media (max-width: 520px) {
      header { display: block; }
      header button { width: 100%; margin-top: 17px; }
      .check { grid-template-columns: 11px 1fr; }
      .badge { grid-column: 2; justify-self: start; }
      footer { display: block; }
      footer span { display: block; margin-top: 5px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .summary-dot.loading { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">HEX GFX</p>
        <h1 id="page-title">Service status</h1>
        <p class="intro" id="page-message">
          Live, read-only checks from the same configuration used by the app.
        </p>
      </div>
      <button type="button" id="run">RUN CHECKS</button>
    </header>

    <section class="summary" aria-live="polite">
      <span class="summary-dot loading" id="summary-dot" aria-hidden="true"></span>
      <div>
        <h2 id="summary-title">Loading diagnostics…</h2>
        <p id="summary-detail">Reading diagnostics.json</p>
      </div>
    </section>

    <section class="checks" id="checks" aria-label="Service checks"></section>

    <footer>
      <span>No device information or diagnostic report is uploaded by this page.</span>
      <span id="checked-at">Not checked yet</span>
    </footer>
  </main>

  <script>
    (() => {
      'use strict';

      const configUrl = './diagnostics.json';
      const runButton = document.querySelector('#run');
      const checksElement = document.querySelector('#checks');
      const summaryDot = document.querySelector('#summary-dot');
      const summaryTitle = document.querySelector('#summary-title');
      const summaryDetail = document.querySelector('#summary-detail');
      const checkedAt = document.querySelector('#checked-at');
      let runNumber = 0;

      const setSummary = (state, title, detail) => {
        summaryDot.className = `summary-dot ${state}`;
        summaryTitle.textContent = title;
        summaryDetail.textContent = detail;
      };

      const addRow = (name, state, detail) => {
        const row = document.createElement('article');
        row.className = 'check';

        const dot = document.createElement('span');
        dot.className = `check-dot ${state}`;
        dot.setAttribute('aria-hidden', 'true');

        const labels = document.createElement('div');
        const title = document.createElement('h3');
        const description = document.createElement('p');
        title.textContent = name;
        description.textContent = detail;
        labels.append(title, description);

        const badge = document.createElement('span');
        badge.className = `badge ${state}`;
        badge.textContent = state.toUpperCase();

        row.append(dot, labels, badge);
        checksElement.append(row);
      };

      const timedFetch = async (url, timeoutMs) => {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);
        const started = performance.now();
        try {
          const separator = url.includes('?') ? '&' : '?';
          const response = await fetch(`${url}${separator}hex_status=${Date.now()}`, {
            cache: 'no-store',
            signal: controller.signal,
            headers: { Accept: 'application/json,text/plain,*/*' }
          });
          return { response, elapsed: Math.round(performance.now() - started) };
        } finally {
          clearTimeout(timer);
        }
      };

      const checkEndpoint = async (item, timeoutMs, activeRun) => {
        const name = String(item.name || item.label || 'Remote service').slice(0, 60);
        const required = item.required !== false;
        try {
          const { response, elapsed } = await timedFetch(String(item.url), timeoutMs);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);

          const expected = String(item.expect || item.type || 'json').toLowerCase();
          if (expected === 'json') await response.json();
          if (expected === 'text' && !(await response.text()).trim()) {
            throw new Error('Response is blank');
          }
          if (activeRun !== runNumber) return null;
          return { name, state: 'pass', detail: `HTTP ${response.status} • ${elapsed} ms` };
        } catch (error) {
          if (activeRun !== runNumber) return null;
          const reason = error && error.name === 'AbortError'
            ? 'Request timed out'
            : String(error && error.message || 'Request failed').slice(0, 100);
          return { name, state: required ? 'fail' : 'warn', detail: reason };
        }
      };

      const run = async () => {
        const activeRun = ++runNumber;
        runButton.disabled = true;
        checksElement.replaceChildren();
        setSummary('loading', 'Running service checks…', 'Reading diagnostics.json');

        let config;
        try {
          const { response, elapsed } = await timedFetch(configUrl, 8000);
          if (!response.ok) throw new Error(`diagnostics.json HTTP ${response.status}`);
          config = await response.json();
          if (activeRun !== runNumber) return;
          addRow('GitHub Pages', 'pass', `Configuration loaded • ${elapsed} ms`);
        } catch (error) {
          if (activeRun !== runNumber) return;
          const reason = error && error.name === 'AbortError'
            ? 'Request timed out'
            : String(error && error.message || 'Configuration unavailable').slice(0, 100);
          addRow('GitHub Pages', 'fail', reason);
          setSummary('fail', 'Status configuration unavailable', reason);
          checkedAt.textContent = `Checked ${new Date().toLocaleString()}`;
          runButton.disabled = false;
          return;
        }

        const data = config && config.diagnostics ? config.diagnostics : config;
        document.querySelector('#page-title').textContent = String(
          data.title || 'Service status'
        ).slice(0, 80);
        document.querySelector('#page-message').textContent = String(
          data.message || 'Live service checks controlled by GitHub Pages.'
        ).slice(0, 240);

        if (data.enabled === false || data.show === false) {
          addRow('Remote checks', 'warn', 'Disabled in diagnostics.json');
          setSummary('warn', 'Remote diagnostics paused', 'Enable it in diagnostics.json');
          checkedAt.textContent = `Checked ${new Date().toLocaleString()}`;
          runButton.disabled = false;
          return;
        }

        const timeoutMs = Math.max(3000, Math.min(15000,
          Number(data.timeout_ms) || 8000));
        const configured = Array.isArray(data.checks)
          ? data.checks
          : (Array.isArray(data.endpoints) ? data.endpoints : []);
        const endpoints = configured.filter(item => item && item.enabled !== false
          && typeof item.url === 'string' && /^https:\/\//i.test(item.url)).slice(0, 10);

        if (!endpoints.length) {
          addRow('Remote services', 'warn', 'No checks configured');
          setSummary('warn', 'No service checks configured', 'Edit diagnostics.json');
          checkedAt.textContent = `Checked ${new Date().toLocaleString()}`;
          runButton.disabled = false;
          return;
        }

        const results = await Promise.all(
          endpoints.map(item => checkEndpoint(item, timeoutMs, activeRun))
        );
        if (activeRun !== runNumber) return;

        let failures = 0;
        let warnings = 0;
        results.filter(Boolean).forEach(result => {
          addRow(result.name, result.state, result.detail);
          if (result.state === 'fail') failures += 1;
          if (result.state === 'warn') warnings += 1;
        });

        if (failures) {
          setSummary('fail', `${failures} service issue${failures === 1 ? '' : 's'} found`,
            warnings ? `${warnings} additional warning${warnings === 1 ? '' : 's'}`
              : 'See the failed checks below');
        } else if (warnings) {
          setSummary('warn', 'Services online with warnings',
            `${warnings} optional check${warnings === 1 ? '' : 's'} unavailable`);
        } else {
          setSummary('pass', 'All configured services are online',
            `${results.length} check${results.length === 1 ? '' : 's'} passed`);
        }

        checkedAt.textContent = `Checked ${new Date().toLocaleString()}`;
        runButton.disabled = false;
      };

      runButton.addEventListener('click', run);
      run();
    })();
  </script>
</body>
</html>
